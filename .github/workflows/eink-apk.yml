name: E-ink APK

# Builds the "ReadAny 墨水屏" Android variant (APP_VARIANT=eink) for Onyx
# BOOX-firmware tablets and publishes it as a prerelease for direct download.

on:
  push:
    branches:
      - "claude/**"
    paths:
      - "packages/app-expo/**"
      - "packages/core/**"
      - "packages/foliate-js/**"
      - ".github/workflows/eink-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eink-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_VARIANT: eink
      EXPO_NO_METRO_WORKSPACE_ROOT: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build reader assets
        run: pnpm --filter @readany/app-expo run build:reader

      - name: Generate native Android project
        working-directory: packages/app-expo
        run: CI=1 npx expo prebuild --platform android --no-install --clean

      - name: Build release APK
        working-directory: packages/app-expo/android
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Rename APK
        id: apk
        run: |
          VERSION=$(node -p "require('./packages/app-expo/package.json').version")
          NAME="ReadAny-eink-${VERSION}-build${{ github.run_number }}.apk"
          mv packages/app-expo/android/app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: eink-build-${{ github.run_number }}
          name: ReadAny 墨水屏 · build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            ReadAny e-ink build for Onyx BOOX-firmware tablets (arm64).
            Package `com.readany.app.eink` installs next to the regular app.
          files: ${{ steps.apk.outputs.name }}
